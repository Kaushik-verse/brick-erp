  <path d="M27 31a7 7 0 0 1 7-7h2.4v54H34a7 7 0 0 1-7-7z" fill="url(#spine)"/>
  <!-- bookmark ribbon -->
  <path d="M60 22.5h7v18l-3.5-3-3.5 3z" fill="url(#ribbon)" stroke="#B9770C" stroke-width="1"/>
