  <rect x="50.2" y="45.6" width="14" height="7.6" rx="1.8" fill="url(#brick)" stroke="#8E3415" stroke-opacity=".55" stroke-width="1.1"/>
  <rect x="51.400000000000006" y="46.6" width="11.6" height="1.6" rx=".8" fill="#FFFFFF" opacity=".7"/>
